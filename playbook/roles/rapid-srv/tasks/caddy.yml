---
- name: Create www root directory
  ansible.builtin.file:
    path: '{{ rapid_srv_www_root }}'
    state: directory
    mode: '0755'
- name: Create index file
  ansible.builtin.copy:
    dest: '{{ rapid_srv_www_root }}/index.html'
    content: '{{ domain_name }}'
    mode: '0644'
- name: Create repos.txt
  ansible.builtin.template:
    src: repos.txt.j2
    dest: '{{ rapid_srv_www_root }}/repos.txt'
    mode: '0644'
  register: repos_txt
# gzip stamps the time into the header, so recompressing unchanged input still
# rewrites the file and busts every client's cache of it. Not a handler: one
# that didn't get flushed would leave repos.gz stale for good, as the next run
# finds repos.txt unchanged and never notifies again.
- name: Create repos.gz  # noqa: no-handler
  community.general.archive:
    path: '{{ rapid_srv_www_root }}/repos.txt'
    dest: '{{ rapid_srv_www_root }}/repos.gz'
    mode: '0644'
  when: repos_txt is changed
- name: Create caddy config directory
  ansible.builtin.file:
    path: /opt/caddy/config
    state: directory
    mode: '0755'
- name: Write caddy config
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/caddy/config/Caddyfile
    mode: '0644'
  notify: Reload Caddy
- name: Set up Caddy container
  containers.podman.podman_container:
    name: caddy
    state: quadlet
    image: docker.io/library/caddy:2
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - '/opt/caddy/config:/etc/caddy:ro'
      - '{{ rapid_srv_www_root }}:/srv/repos:idmap,ro'
      - 'caddy_data:/data:idmap'
      - 'caddy_config:/config:idmap'
    network: priv.network
    quadlet_options:
      - 'AutoUpdate=registry'
      - 'Pull=newer'
      - 'UserNS=auto'
      - |
        [Install]
        WantedBy=default.target
      - |
        [Service]
        ExecReload=podman exec -w /etc/caddy caddy caddy reload
  notify: Restart Caddy
- name: Start and enable Caddy service
  ansible.builtin.systemd_service:
    name: caddy.service
    enabled: true
    state: started
    daemon_reload: true
