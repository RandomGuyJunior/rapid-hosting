---
# Send metrics and logs to a monitoring server set up with ansible-monitoring.
# Needs the monitoring write credentials when pointing at the prod instance.
configure_monitoring: false

# Rapid repos the builder may build and Caddy serves, keyed by repo name.
# For configuration see rapid-builder/docs/configuration.md
builder_repos:
  minitest:
    githubRepository: p2004a/minimal-rapid-repo
    policy: "true"
